services:
  a9n-build:
    build:
      context: .
      dockerfile: Dockerfile

    working_dir: /workspace

    volumes:
      - .:/workspace
      - a9n-ccache:/workspace/.ccache

    environment:
      CCACHE_DIR: /workspace/.ccache
      CCACHE_MAXSIZE: 2G
      ARCH: ${ARCH:-x86_64}
      PLATFORM: ${PLATFORM:-qemu}
      BUILD_TYPE: ${BUILD_TYPE:-Release}

    command:
      - bash
      - -lc
      - |
        set -eux
        build_dir="build-${ARCH}-${PLATFORM}-${BUILD_TYPE}"
        cmake -S . -B "$${build_dir}" \
          -DARCH="${ARCH}" \
          -DPLATFORM="${PLATFORM}" \
          -DCMAKE_TOOLCHAIN_FILE="./src/hal/${ARCH}/toolchain.cmake" \
          -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
          -G Ninja
        cmake --build "$${build_dir}" -- -k 0

volumes:
  a9n-ccache:
