name: build

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build.yml'
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.arch }} • ${{ matrix.build_type }}
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        arch: [ x86_64 ] # Add more architectures as needed
        build_type: [ Debug, Release ]
        include:
          - arch: x86_64
            extra_pkgs: "nasm"

    env:
      BUILD_DIR: build
      SRC_DIR: ${{ github.workspace }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install toolchain (LLVM 19 + deps)
        shell: bash
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y curl gnupg lsb-release software-properties-common
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 19 all
          sudo apt-get install -y llvm-19-dev clang-19 lld-19 ${{ matrix.extra_pkgs }} ninja-build ccache
          if ! command -v llvm-config >/dev/null 2>&1; then
            sudo ln -sf /usr/bin/llvm-config-19 /usr/local/bin/llvm-config
          fi

      - name: Install latest CMake (via Kitware APT)
        shell: bash
        run: |
          set -eux
          sudo rm -f /etc/apt/sources.list.d/kitware.list
          sudo apt remove --purge cmake || true
          sudo apt-get update
          sudo apt-get install -y ca-certificates gpg wget
          wget -O - https://apt.kitware.com/keys/kitware-archive-latest.asc \
              2>/dev/null | gpg --dearmor \
              | sudo tee /usr/share/keyrings/kitware-archive-keyring.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg] https://apt.kitware.com/ubuntu/ jammy main" | sudo tee /etc/apt/sources.list.d/kitware.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y cmake ${{ matrix.extra_pkgs }} ninja-build ccache


      - name: Show versions
        run: |
          clang-19 --version || true
          ld.lld-19 --version || true
          nasm -v || true
          cmake --version
          ninja --version

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ matrix.arch }}-${{ matrix.build_type }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake', '**/*.[chsS]', '**/*.cpp', '**/*.hpp', '**/*.asm') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.arch }}-${{ matrix.build_type }}-

      - name: Configure (CMake)
        run: |
          set -eux
          cmake -S "${SRC_DIR}" -B "${BUILD_DIR}" \
            -DARCH=${{ matrix.arch }} \
            -DCMAKE_TOOLCHAIN_FILE=./src/hal/${{ matrix.arch }}/toolchain.cmake \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -G Ninja

      - name: Build
        run: |
          set -eux
          cmake --build "${BUILD_DIR}" -- -k 0

      - name: (Optional) Test with CTest if present
        if: ${{ hashFiles(format('{0}/CTestTestfile.cmake', env.BUILD_DIR)) != '' }}
        run: |
          set -eux
          ctest --test-dir "${BUILD_DIR}" --output-on-failure

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}-${{ matrix.build_type }}-artifacts
          path: |
            ${{ env.BUILD_DIR }}/**/*.elf
            ${{ env.BUILD_DIR }}/**/*.ELF
          if-no-files-found: ignore

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
          WORKFLOW: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          ARCH: ${{ matrix.arch }}
          BUILD_TYPE: ${{ matrix.build_type }}
          EVENT_NAME: ${{ github.event_name }}
          SERVER_URL: ${{ github.server_url }}
          COMMIT_MSG: ${{ github.event.head_commit.message || github.event.pull_request.title || '' }}
        run: |
          set -eu

          case "$STATUS" in
            success)   COLOR=3066993;  VERB="✅ Success"   ;;
            cancelled) COLOR=15105570; VERB="⚠️ Cancelled" ;;
            *)         COLOR=15158332; VERB="❌ Failure"   ;;
          esac

          RUN_URL="${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}"
          SHORT_SHA="${SHA:0:7}"

          DESC="$(printf '%s' "${COMMIT_MSG:-}" | head -c 300 | sed 's/"/\\"/g')"

          JSON_PAYLOAD=$(cat <<EOF
          {
            "username": "GitHub Actions",
            "embeds": [
              {
                "title": "${VERB}: ${WORKFLOW} • ${ARCH} • ${BUILD_TYPE}",
                "url": "${RUN_URL}",
                "color": ${COLOR},
                "description": "${DESC}",
                "fields": [
                  { "name": "Repository", "value": "${REPO}", "inline": true },
                  { "name": "Branch",     "value": "${REF}",  "inline": true },
                  { "name": "Event",      "value": "${EVENT_NAME}", "inline": true },
                  { "name": "Commit",     "value": "\`${SHORT_SHA}\`", "inline": true },
                  { "name": "Actor",      "value": "${ACTOR}", "inline": true },
                  { "name": "Run",        "value": "#${RUN_NUMBER}", "inline": true }
                ],
                "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              }
            ]
          }
          EOF
          )

          curl -sS -H "Content-Type: application/json" \
               -d "${JSON_PAYLOAD}" \
               "${DISCORD_WEBHOOK_URL}" >/dev/null


